<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=loja.html">
  <title>Redirecionando para Loja &amp; Kits — Débora Facchinetti</title>
  <script>
    // Se houver hash na URL, preserva no redirecionamento para a Loja & Kits
    const hash = window.location.hash;
    let target = 'loja.html';
    if (hash) {
      if (hash.startsWith('#card-')) {
        target += hash;
      } else if (hash.startsWith('#')) {
        target += '#card-' + hash.substring(1);
      }
    }
    window.location.replace(target);
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 4rem 1.5rem; background: #FAF7F2; color: #2D4030;">
  <h2 style="font-size: 1.5rem; margin-bottom: 0.75rem;">Redirecionando para a Loja &amp; Kits...</h2>
  <p style="font-size: 1rem; color: #555; margin-bottom: 1.5rem;">O catálogo completo de livros e kits agora está reunido na nossa Loja Oficial.</p>
  <p><a href="loja.html" style="display: inline-block; padding: 0.75rem 1.5rem; background: #2D4030; color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;">Acessar Loja &amp; Kits</a></p>
</body>
</html>
