<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Administrativo — Débora Facchinetti</title>
  
  <!-- Fontes Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Estilos Dedicados -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-login-wrapper">
    <div class="login-card">
      
      <div class="login-brand-header">
        <div class="login-badge">
          <i class="fa-solid fa-lock"></i> Área Restrita Editorial
        </div>
        <h1 class="login-title">Débora Facchinetti</h1>
        <p class="login-subtitle">Gestão de Pedidos &amp; Operação da Loja</p>
      </div>

      <div id="loginAlert" class="login-alert"></div>

      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
        <div class="form-group">
          <label class="form-label" for="adminEmail">E-mail de Acesso</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-icon-prefix"></i>
            <input type="email" id="adminEmail" class="form-control" placeholder="debora@deborafacchinetti.com.br" required autocomplete="email" autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Senha</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-key input-icon-prefix"></i>
            <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn-admin-submit">
          <span>Entrar no Painel</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.78rem; color: var(--admin-text-muted);">
        <i class="fa-solid fa-shield-halved"></i> Sessão protegida por criptografia e token JWT.
      </div>

    </div>
  </div>

  <script>
    // Se já estiver logado, redireciona diretamente para o painel
    document.addEventListener('DOMContentLoaded', async () => {
      const token = localStorage.getItem('admin_token');
      if (token) {
        try {
          const res = await fetch('/api/admin/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            window.location.href = 'index.html';
            return;
          } else {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_user');
          }
        } catch (e) {
          // Mantém na tela de login
        }
      }
    });

    async function handleAdminLogin(e) {
      e.preventDefault();
      const alertEl = document.getElementById('loginAlert');
      const btn = document.getElementById('btnSubmitLogin');
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      alertEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Acessando...</span>';

      try {
        const apiUrl = window.location.origin + '/api/admin/auth/login';
        let response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        // Se retornar 404 na rota primária, tenta o alias /api/admin/login
        if (response.status === 404) {
          response = await fetch(window.location.origin + '/api/admin/login', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
        }

        let data = {};
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          data = await response.json();
        } else {
          const rawText = await response.text();
          try {
            data = JSON.parse(rawText);
          } catch (_) {
            data = { success: false, message: rawText || `Erro HTTP ${response.status}` };
          }
        }

        if (response.ok && data.success && data.token) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_user', JSON.stringify(data.user));

          alertEl.className = 'login-alert success';
          alertEl.textContent = 'Login aprovado! Entrando no painel...';
          alertEl.style.display = 'block';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 600);
        } else {
          alertEl.className = 'login-alert error';
          alertEl.textContent = data.message || 'Credenciais inválidas. Verifique os dados digitados.';
          alertEl.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<span>Entrar no Painel</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        console.error('Falha na comunicação com o servidor:', err);
        alertEl.className = 'login-alert error';
        alertEl.textContent = 'Erro ao conectar ao servidor. Verifique sua conexão e tente novamente.';
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '<span>Entrar no Painel</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
